_BASE_: "../../Semi-Base-RCNN-FPN.yaml"
MODEL:
  META_ARCHITECTURE: "SemiHAP2SGeneralizedRCNNv2" 
  WEIGHTS: "//weight/ImageNetPretrained/MSRA/R-101.pkl"
  MASK_ON: False
  RESNETS:
    DEPTH: 101
  ROI_HEADS:
    NUM_CLASSES: 15
INPUT:
  MIN_SIZE_TRAIN: (480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800)
  MIN_SIZE_TEST: 800
  VIS_PERIOD: 500
DATASETS:
  TRAIN: ('voc_2007_trainval_base1', 'voc_2012_trainval_base1')
  SEMI_TEST: ('voc_2007_trainval_novel1',)
  # TEST: ('voc_2007_test_base1',)
SOLVER:
  STEPS: (12000, 16000)
  MAX_ITER:  18000 # 18000  # 17.4 epochs
  WARMUP_ITERS: 100
  CHECKPOINT_PERIOD: 1000
OUTPUT_DIR: "//ex_temp/semircnn/checkpoints/voc/semi_faster_rcnn_hap2s_v2/faster_rcnn_R_101_FPN_base1_bs16_mr3"
TEST:
  EVAL_PERIOD: 1000
