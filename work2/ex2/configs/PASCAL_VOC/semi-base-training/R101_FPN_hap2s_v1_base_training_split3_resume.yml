_BASE_: "../../Semi-Base-RCNN-FPN.yaml"
MODEL:
  META_ARCHITECTURE: "SemiHAP2SGeneralizedRCNNv1"  
  WEIGHTS: "//ex_temp/semircnn/checkpoints/voc_sp3/semi_faster_rcnn_hap2s_os_fpn_correct/search_net_R_101_FPN_base1_bs32_mr3_tl5e-1_ap4/iter10.pth"
  MASK_ON: False
  RESNETS:
    DEPTH: 101
  ROI_HEADS:
    NUM_CLASSES: 15
  INSTANCE_SEARCH:
    FREEZE: True
  BACKBONE:
    FREEZE: True
  PROPOSAL_GENERATOR:
    FREEZE: True
INPUT:
  MIN_SIZE_TRAIN: (480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800)
  MIN_SIZE_TEST: 800
  VIS_PERIOD: 500
DATASETS:
  TRAIN: ('voc_2007_trainval_base1', 'voc_2012_trainval_base1')
  SEMI_TEST: ('voc_2007_trainval_novel1', 'voc_2012_trainval_novel1')
  # TEST: ('voc_2007_test_base1',)
SOLVER:
  STEPS: (12000, 16000)
  MAX_ITER:  18000 # 18000  # 17.4 epochs
  WARMUP_ITERS: 100
  CHECKPOINT_PERIOD: 1000
OUTPUT_DIR: "checkpoints/voc/semi_faster_rcnn_hap2s_v1/faster_rcnn_R_101_FPN_base1_bs16_mr3"
TEST:
  EVAL_PERIOD: 10
  SHOT_NUM: 1 
  PATCH_CHOICE: "random"
  SCREENING_STRATEGY: "filter_fp"
  SAVE_PATH: '//data/SODdet/retrieval_vocsplit3_txt'
