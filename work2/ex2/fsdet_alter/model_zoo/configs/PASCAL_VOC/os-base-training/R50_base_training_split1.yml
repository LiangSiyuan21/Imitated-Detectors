  SEMI_TEST: ('voc_2007_test_novel1',)
SOLVER:
  STEPS: (12000, 16000)
  MAX_ITER:  10 # 18000  # 17.4 epochs
  WARMUP_ITERS: 100
OUTPUT_DIR: "checkpoints/voc/os-faster_rcnn/faster_rcnn_R_50_C4_base1"
