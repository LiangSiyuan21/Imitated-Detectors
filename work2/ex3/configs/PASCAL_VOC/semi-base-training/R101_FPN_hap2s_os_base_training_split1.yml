_BASE_: "../../Semi-Base-RCNN-FPN.yaml"
MODEL:
  META_ARCHITECTURE: "OSHAP2SGeneralizedRCNNFPN"  
  WEIGHTS: "/srv/hdd/weight/ImageNetPretrained/MSRA/R-101.pkl"
  MASK_ON: False
  RESNETS:
    DEPTH: 101
  ROI_HEADS:
    NUM_CLASSES: 15
INPUT:
  MIN_SIZE_TRAIN: (480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800)
  MIN_SIZE_TEST: 800
  VIS_PERIOD: 150
DATASETS:
  TRAIN: ('voc_2007_trainval_base1', 'voc_2012_trainval_base1')
  SEMI_TEST: ('voc_2007_trainval_novel1',)
  # TEST: ('voc_2007_test_base1',)
SOLVER:
  IMS_PER_BATCH: 1 # 128 #16
  BASE_LR:  0.005 #0.01 #0.02
  STEPS: (950, 1900) #(520, 1030) #(12000, 16000)
  MAX_ITER: 4500 #1300 # 18000  # 17.4 epochs
  WARMUP_ITERS: 0 #0 #100
  CHECKPOINT_PERIOD: 300
# OUTPUT_DIR: "//selenaliang/ex_temp/semircnn/checkpoints/voc/semi_faster_rcnn_os_fpn_again/search_net_R_101_FPN_base1_bs64_mr3"
OUTPUT_DIR: "checkpoints/voc/semi_hap2s_faster_rcnn_os_fpn/search_net_R_101_FPN_base1_bs64_mr3"
TEST:
  EVAL_PERIOD: 300 #130 #1000
