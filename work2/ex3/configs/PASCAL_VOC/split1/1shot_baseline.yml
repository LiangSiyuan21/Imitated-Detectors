_BASE_: "../../Semi-Base-RCNN-FPN.yaml"

MODEL:
  META_ARCHITECTURE: "SemiHAP2SGeneralizedRCNNv1"  
  WEIGHTS: "//selenaliang/ex_temp/semircnn/checkpoints/voc/semi_faster_rcnn_hap2s_v1_resume_rpn_fr/faster_rcnn_R_101_FPN_base1_bs16/model_reset_surgery.pth"
  MASK_ON: False
  RESNETS:
    DEPTH: 101

  BACKBONE:
    FREEZE: True
    FREEZE_AT: 5

  PROPOSAL_GENERATOR:
    FREEZE: True
  RPN:
    POST_NMS_TOPK_TRAIN: 2000

  ROI_HEADS:
    NUM_CLASSES: 20
    OUTPUT_LAYER: "CosineSimOutputLayers"
    FREEZE_FEAT: True
    UNFREEZE_FC2: True
    BATCH_SIZE_PER_IMAGE: 256
    IOU_THRESHOLDS: [0.4]

INPUT:
  CROP:
    ENABLED: TRUE
  MIN_SIZE_TRAIN: (480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800)
  MIN_SIZE_TEST: 800

DATASETS:
  TRAIN: ('voc_2007_trainval_all1_1shot_seed5',)
  TEST: ('voc_2007_test_all1',)

SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.001
  STEPS: (3500,)
  MAX_ITER: 6000
  CHECKPOINT_PERIOD: 5000
  WARMUP_ITERS: 20

TEST:
  EVAL_PERIOD: 700

OUTPUT_DIR: "//selenaliang/ex_temp/semircnn/checkpoints/voc/semi_faster_rcnn_hap2s_v1_resume_rpn_fr/1shot_seed1_baseline"