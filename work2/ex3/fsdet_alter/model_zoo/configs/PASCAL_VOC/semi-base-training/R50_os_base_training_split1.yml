_BASE_: "../../OS-Base-RCNN-C4.yaml"
MODEL:
  META_ARCHITECTURE: "OSGeneralizedRCNN50" 
  WEIGHTS: "/srv/hdd/weight/ImageNetPretrained/MSRA/R-50.pkl"
  MASK_ON: False
  RESNETS:
    DEPTH: 50
  ROI_HEADS:
    NUM_CLASSES: 15
INPUT:
  MIN_SIZE_TRAIN: (480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800)
  MIN_SIZE_TEST: 800
DATASETS:
  TRAIN: ('voc_2007_trainval_base1', 'voc_2012_trainval_base1')
  SEMI_TEST: ('voc_2007_trainval_novel1',)
SOLVER:
  IMS_PER_BATCH: 1 # 128 #16
  BASE_LR:  0.0025 #0.01 #0.02
  STEPS: (1900, 3800) #(520, 1030) #(12000, 16000)
  MAX_ITER: 100 #1300 # 18000  # 17.4 epochs
  WARMUP_ITERS: 0 #0 #100
  CHECKPOINT_PERIOD: 300
OUTPUT_DIR: "checkpoints/voc/semi_faster_rcnn_os_r50/search_net_R_50_FPN_base1_bs32_mr3"
TEST:
  EVAL_PERIOD: 300 #130 #1000
